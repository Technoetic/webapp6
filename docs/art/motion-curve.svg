<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Optional motion rule: cubic ease-out curve and staggered play-once timeline</title>
  <desc id="desc">Left panel plots cubic ease-out v(t) = V(1 - (1 - t/T)^3) over T = 1.2 s compared with a dashed linear reference, landing on 100 percent at t = T. Right panel shows six KPI tiles staggered 100 ms apart, each counting up over 1.2 s once.</desc>
  <rect width="960" height="360" rx="12" fill="#0B0F1A" stroke="#2A3550" stroke-width="2"/>
  <text x="32" y="38" fill="#F8FAFC" font-family="Segoe UI, Verdana, sans-serif" font-size="19" font-weight="700">Illustrative Motion Timing: Cubic Ease-Out &amp; Play-Once Stagger</text>
  <rect x="32" y="46" width="260" height="3" fill="#FF2E93"/>
  <text x="928" y="38" text-anchor="end" fill="#64748B" font-family="Consolas, monospace" font-size="12">webapp6 v0.2.0</text>

  <!-- Left panel: Ease-out curve -->
  <rect x="28" y="66" width="436" height="270" rx="8" fill="#111726" stroke="#26314A"/>
  <text x="48" y="88" fill="#E2E8F0" font-family="Segoe UI, Verdana, sans-serif" font-size="13" font-weight="700">Cubic ease-out (T = 1.2 s) vs linear</text>
  <g stroke="#26314A" stroke-width="1">
    <line x1="74" y1="94" x2="434" y2="94"/>
    <line x1="74" y1="144" x2="434" y2="144"/>
    <line x1="74" y1="194" x2="434" y2="194"/>
    <line x1="74" y1="244" x2="434" y2="244"/>
    <line x1="74" y1="294" x2="434" y2="294" stroke="#64748B"/>
    <line x1="74" y1="94" x2="74" y2="294" stroke="#64748B"/>
  </g>
  <line x1="74" y1="294" x2="434" y2="94" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 4"/>
  <polyline fill="none" stroke="#00F5D4" stroke-width="3" points="74.0,294.0 89.0,270.0 104.0,248.1 119.0,228.0 134.0,209.7 149.0,193.2 164.0,178.4 179.0,165.1 194.0,153.3 209.0,142.8 224.0,133.7 239.0,125.8 254.0,119.0 269.0,113.3 284.0,108.5 299.0,104.5 314.0,101.4 329.0,99.0 344.0,97.1 359.0,95.8 374.0,94.9 389.0,94.4 404.0,94.1 419.0,94.0 434.0,94.0"/>
  <circle cx="434" cy="94" r="5" fill="#C8FF00"/>
  <g fill="#94A3B8" font-family="Consolas, monospace" font-size="11">
    <text x="66" y="98" text-anchor="end">100%</text>
    <text x="66" y="198" text-anchor="end">50%</text>
    <text x="66" y="298" text-anchor="end">0%</text>
    <text x="74" y="314" text-anchor="middle">0.0s</text>
    <text x="254" y="314" text-anchor="middle">0.6s</text>
    <text x="434" y="314" text-anchor="middle">1.2s</text>
    <text x="348" y="114" fill="#C8FF00" font-weight="700">v(T) = V</text>
    <text x="280" y="220" fill="#94A3B8">linear ref</text>
  </g>

  <!-- Right panel: Stagger timeline -->
  <rect x="484" y="66" width="448" height="270" rx="8" fill="#111726" stroke="#26314A"/>
  <text x="504" y="88" fill="#E2E8F0" font-family="Segoe UI, Verdana, sans-serif" font-size="13" font-weight="700">Header tiles: 100 ms stagger, plays once</text>
  <g>
    <text x="592" y="118" text-anchor="end" fill="#CBD5E1" font-family="Segoe UI, Verdana, sans-serif" font-size="11.5">principles (6)</text>
    <rect x="602" y="104" width="316" height="20" rx="4" fill="#131929" stroke="#26314A"/>
    <rect x="602.0" y="106" width="210.7" height="16" rx="3" fill="#00F5D4" fill-opacity="0.88"/>
    <text x="806.7" y="118" text-anchor="end" fill="#0B0F1A" font-family="Consolas, monospace" font-size="10.5" font-weight="700">0..1200ms</text>
    <text x="592" y="151" text-anchor="end" fill="#CBD5E1" font-family="Segoe UI, Verdana, sans-serif" font-size="11.5">hosts (3)</text>
    <rect x="602" y="137" width="316" height="20" rx="4" fill="#131929" stroke="#26314A"/>
    <rect x="619.6" y="139" width="210.7" height="16" rx="3" fill="#FF2E93" fill-opacity="0.88"/>
    <text x="824.2" y="151" text-anchor="end" fill="#0B0F1A" font-family="Consolas, monospace" font-size="10.5" font-weight="700">100..1300ms</text>
    <text x="592" y="184" text-anchor="end" fill="#CBD5E1" font-family="Segoe UI, Verdana, sans-serif" font-size="11.5">skill (1)</text>
    <rect x="602" y="170" width="316" height="20" rx="4" fill="#131929" stroke="#26314A"/>
    <rect x="637.1" y="172" width="210.7" height="16" rx="3" fill="#C8FF00" fill-opacity="0.88"/>
    <text x="841.8" y="184" text-anchor="end" fill="#0B0F1A" font-family="Consolas, monospace" font-size="10.5" font-weight="700">200..1400ms</text>
    <text x="592" y="217" text-anchor="end" fill="#CBD5E1" font-family="Segoe UI, Verdana, sans-serif" font-size="11.5">checks (15)</text>
    <rect x="602" y="203" width="316" height="20" rx="4" fill="#131929" stroke="#26314A"/>
    <rect x="654.7" y="205" width="210.7" height="16" rx="3" fill="#FF9E00" fill-opacity="0.88"/>
    <text x="859.3" y="217" text-anchor="end" fill="#0B0F1A" font-family="Consolas, monospace" font-size="10.5" font-weight="700">300..1500ms</text>
    <text x="592" y="250" text-anchor="end" fill="#CBD5E1" font-family="Segoe UI, Verdana, sans-serif" font-size="11.5">tests (16)</text>
    <rect x="602" y="236" width="316" height="20" rx="4" fill="#131929" stroke="#26314A"/>
    <rect x="672.2" y="238" width="210.7" height="16" rx="3" fill="#7B61FF" fill-opacity="0.88"/>
    <text x="876.9" y="250" text-anchor="end" fill="#0B0F1A" font-family="Consolas, monospace" font-size="10.5" font-weight="700">400..1600ms</text>
    <text x="592" y="283" text-anchor="end" fill="#CBD5E1" font-family="Segoe UI, Verdana, sans-serif" font-size="11.5">CI OS (2)</text>
    <rect x="602" y="269" width="316" height="20" rx="4" fill="#131929" stroke="#26314A"/>
    <rect x="689.8" y="271" width="210.7" height="16" rx="3" fill="#38BDF8" fill-opacity="0.88"/>
    <text x="894.4" y="283" text-anchor="end" fill="#0B0F1A" font-family="Consolas, monospace" font-size="10.5" font-weight="700">500..1700ms</text>
  </g>
  <g fill="#94A3B8" font-family="Consolas, monospace" font-size="11">
    <text x="602" y="320" text-anchor="middle">0s</text>
    <text x="707" y="320" text-anchor="middle">0.6s</text>
    <text x="813" y="320" text-anchor="middle">1.2s</text>
    <text x="918" y="320" text-anchor="middle">1.8s</text>
  </g>
</svg>
